<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101013" />
    <title>phack.rs · Purdue Hackers</title>
    <style>
      @font-face {
        font-family: DepartureMono;
        src: url("/dashboard/DepartureMono.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: JetBrainsMono;
        src: url("/dashboard/JetBrainsMono.woff2") format("woff2");
        font-weight: 100 800;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        font:
          14px/1.5 JetBrainsMono,
          monospace;
        color: #f5f5f5;
        background: #101013;
        --muted: #a1a1aa;
        --line: #35353b;
        --yellow: #fdfa4a;
        --purple: #7d3bff;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body,
      h1,
      h2,
      p {
        margin: 0;
      }
      ::selection {
        background: var(--purple);
        color: #fff;
      }
      button,
      input {
        font: inherit;
        border-radius: 0;
      }
      button {
        font-family: DepartureMono, monospace;
        text-transform: uppercase;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
        border: 1px solid #777780;
        background: transparent;
        color: inherit;
        padding: 9px 14px;
      }
      button:hover {
        background: var(--yellow);
        color: #101013;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .primary {
        background: var(--yellow);
        color: #101013;
      }
      .primary:hover {
        background: var(--purple);
        border-color: var(--purple);
        color: #fff;
      }
      button.quiet {
        border-color: transparent;
      }
      button.danger:hover {
        color: #fff;
        background: #b62920;
        border-color: #b62920;
      }
      :focus-visible {
        outline: 2px solid var(--purple);
        outline-offset: 3px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        color: var(--purple);
      }
      input {
        min-width: 0;
        width: 100%;
        color: inherit;
        background: transparent;
        border: 1px solid #55555c;
        padding: 11px 12px;
      }
      input::placeholder {
        color: #777780;
        opacity: 1;
      }
      label {
        display: block;
        font-size: 12px;
      }
      label > input,
      label > .prefix {
        margin-top: 7px;
      }
      h1 {
        font-family: DepartureMono, monospace;
        text-transform: uppercase;
        color: var(--yellow);
        font-size: 33px;
        letter-spacing: 0;
        line-height: 1.15;
        font-weight: 500;
      }
      h2 {
        font-size: 17px;
        font-weight: 500;
      }
      .muted {
        color: var(--muted);
      }
      .mono,
      code {
        font-family: JetBrainsMono, monospace;
        font-size: 12px;
      }
      .shell {
        width: min(1120px, calc(100% - 64px));
        margin-inline: auto;
      }
      header {
        border-bottom: 1px solid #35353b;
        background: #101013;
      }
      header .shell {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 64px;
        gap: 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: DepartureMono, monospace;
        font-size: 20px;
        letter-spacing: 0;
      }
      .brand svg {
        width: 28px;
        height: 28px;
      }
      nav {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      main {
        padding-block: 38px 55px;
      }
      .intro {
        margin-bottom: 28px;
      }
      #create {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) auto;
        gap: 15px;
        align-items: end;
        padding-block: 24px;
        border-block: 1px solid #35353b;
      }
      #create > button {
        padding-block: 11px;
      }
      .prefix {
        display: flex;
        align-items: center;
        border: 1px solid #55555c;
        padding-left: 12px;
      }
      .prefix span {
        color: var(--muted);
      }
      .prefix input {
        border: 0;
        padding-left: 3px;
      }
      .prefix:focus-within {
        outline: 2px solid var(--purple);
        outline-offset: 3px;
      }
      .prefix input:focus-visible {
        outline: none;
      }
      .list-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin: 30px 0 12px;
      }
      .list-heading h2 {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #count {
        font:
          12px DepartureMono,
          monospace;
        color: var(--muted);
      }
      #search {
        width: 270px;
        padding: 8px 0;
        border: 0;
        border-bottom: 1px solid #55555c;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th {
        text-transform: uppercase;
        font:
          11px DepartureMono,
          monospace;
        letter-spacing: 0.08em;
        color: var(--muted);
        padding: 12px 8px;
        text-align: left;
        border-block: 1px solid var(--line);
      }
      th:first-child {
        width: 25%;
      }
      th:nth-child(3) {
        width: 75px;
        text-align: right;
      }
      th:last-child {
        width: 182px;
        text-align: right;
      }
      td {
        padding: 14px 8px;
        border-bottom: 1px solid var(--line);
      }
      td:first-child,
      th:first-child {
        padding-left: 0;
      }
      td:last-child,
      th:last-child {
        padding-right: 0;
      }
      tbody tr:hover {
        background: #19191e;
      }
      td:first-child a {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: JetBrainsMono, monospace;
        font-size: 13px;
      }
      .destination {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
      }
      .views {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 2px;
      }
      .actions button {
        padding: 5px 8px;
        font-size: 11px;
        border-color: transparent;
      }
      #empty {
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
      }
      #welcome {
        padding-block: 25px;
        border-block: 1px solid #35353b;
      }
      #welcome p {
        margin: 8px 0 20px;
        color: var(--muted);
      }
      #message:not(:empty) {
        position: fixed;
        z-index: 10;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(640px, calc(100% - 32px));
        width: max-content;
        border: 1px solid #777780;
        background: var(--yellow);
        color: #101013;
        padding: 12px 18px;
        overflow-wrap: anywhere;
      }
      #message[data-error="true"] {
        background: #ffddd8;
        color: #771d16;
      }
      dialog {
        background: #101013;
        color: inherit;
        border: 1px solid #777780;
        border-radius: 0;
        padding: 25px;
        width: min(520px, calc(100% - 32px));
        max-height: calc(100% - 48px);
      }
      dialog::backdrop {
        background: #0007;
      }
      .dialog-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 10px;
      }
      .dialog-heading h2 {
        font-size: 23px;
        overflow-wrap: anywhere;
      }
      dialog > p {
        font-size: 13px;
        margin-bottom: 22px;
      }
      dialog form {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: end;
      }
      dialog form label {
        flex: 1;
        min-width: 190px;
      }
      #key-list {
        padding: 0;
        margin: 20px 0 0;
        list-style: none;
      }
      #key-list:empty::after {
        content: "No API keys yet.";
        color: var(--muted);
        font-size: 13px;
      }
      #key-list li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
      }
      #key-list code {
        color: var(--muted);
        display: block;
        margin-top: 3px;
      }
      #new-key {
        border-block: 1px solid #35353b;
        padding-block: 15px;
        margin-top: 20px;
      }
      #new-key p {
        font-size: 12px;
        margin-bottom: 10px;
      }
      #new-key code {
        display: block;
        overflow-wrap: anywhere;
        margin-bottom: 12px;
      }
      #edit-form {
        display: block;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 23px;
      }
      .feedback:empty {
        display: none;
      }
      .feedback {
        margin: 18px 0 0;
        color: var(--purple);
        overflow-wrap: anywhere;
      }
      .feedback[data-error="true"] {
        color: #b62920;
      }
      @media (max-width: 700px) {
        .shell {
          width: calc(100% - 32px);
        }
        header .shell {
          min-height: 68px;
          gap: 8px;
        }
        .brand {
          font-size: 21px;
          gap: 10px;
        }
        nav button {
          padding: 7px 9px;
          font-size: 12px;
        }
        main {
          padding-top: 28px;
        }
        #create {
          grid-template-columns: 1fr;
        }
        #create > button {
          width: 100%;
        }
        .list-heading {
          align-items: start;
          gap: 13px;
          flex-direction: column;
        }
        #search {
          width: 100%;
        }
        thead {
          display: none;
        }
        table,
        tbody,
        tr,
        td {
          display: block;
          width: 100%;
        }
        tr {
          position: relative;
          padding: 14px 0;
          border-top: 1px solid var(--line);
        }
        td {
          padding: 0;
          border: 0;
        }
        td:first-child {
          padding-right: 167px;
        }
        .destination {
          margin-top: 10px;
          font-size: 11px;
        }
        .views {
          text-align: left;
          color: var(--muted);
          margin-top: 6px;
          font-size: 10px;
        }
        .views::after {
          content: " views";
        }
        .actions {
          position: absolute;
          right: 0;
          top: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="shell">
        <a class="brand" href="/dashboard" aria-label="phack.rs dashboard">
          <svg viewBox="357 359 1099 1100" fill="currentColor" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M723.58 1458.25H357.555V1092.02H723.58V1458.25ZM1089.6 725.795H1455.63V1458.25H1089.6V1092.02H723.58V359.568H1089.6V725.795Z"
            />
          </svg>
          phack.rs
        </a>
        <nav aria-label="Account">
          <button id="manage-keys" hidden>API keys</button
          ><button id="logout" class="quiet" hidden>Sign out</button>
        </nav>
      </div>
    </header>
    <main class="shell">
      <div class="intro">
        <h1>Links</h1>
      </div>
      <section id="welcome">
        <p>Sign in with your Purdue Hackers ID to manage links.<br />Organizers only.</p>
        <button id="login" class="primary" disabled>Checking your session…</button>
      </section>
      <div id="workspace" hidden>
        <form id="create">
          <label
            >Destination URL<input
              name="destination"
              type="url"
              placeholder="https://something-worth-sharing.com"
              required
          /></label>
          <label
            >Short link <span class="muted">· optional</span
            ><span class="prefix"
              ><span class="mono">phack.rs/</span
              ><input
                name="slug"
                aria-label="Short link slug"
                placeholder="your-idea"
                maxlength="64"
                autocapitalize="off"
                spellcheck="false" /></span
          ></label>
          <button class="primary">Create link <span aria-hidden="true">↗</span></button>
        </form>
        <div class="list-heading">
          <span id="count">0 links</span>
          <input
            id="search"
            type="search"
            aria-label="Search links"
            placeholder="Search links or destinations…"
          />
        </div>
        <table aria-label="Short links">
          <thead>
            <tr>
              <th>Short link</th>
              <th>Destination</th>
              <th>Views</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <p id="empty" hidden></p>
      </div>
    </main>
    <p id="message" role="status" aria-live="polite"></p>
    <dialog id="keys" aria-labelledby="keys-title">
      <div class="dialog-heading">
        <h2 id="keys-title">Your API keys</h2>
        <button class="quiet" data-close aria-label="Close API keys">✕</button>
      </div>
      <form id="key-create">
        <label>Key name<input name="name" placeholder="e.g. Wack Hacker" required /></label
        ><button class="primary">Create key</button>
      </form>
      <div id="new-key" hidden>
        <p>Copy this key now. You won’t be able to see it again.</p>
        <code></code><button id="copy-key">Copy key</button>
      </div>
      <ul id="key-list"></ul>
      <p class="feedback" role="status"></p>
    </dialog>
    <dialog id="edit" aria-labelledby="edit-title">
      <div class="dialog-heading">
        <h2 id="edit-title">Edit link</h2>
        <button class="quiet" data-close aria-label="Close edit">✕</button>
      </div>
      <form id="edit-form">
        <label>Destination URL<input name="destination" type="url" required /></label>
        <div class="dialog-actions">
          <button type="button" data-close>Cancel</button
          ><button class="primary">Save changes</button>
        </div>
      </form>
      <p class="feedback" role="status"></p>
    </dialog>
    <script type="module" src="/dashboard/main.js"></script>
  </body>
</html>
